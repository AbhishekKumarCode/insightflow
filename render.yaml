services:
  - type: web
    name: insightflow
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ADAPTION_API_KEY
        sync: false
